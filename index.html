<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>H4 吞噬訊號</title>
<meta name="description" content="Exness MT4 24 個商品 H4 全包吞噬，訊號出現當下的新聞有利／不利評估，每 4 小時更新。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f5f2; --card:#ffffff; --ink:#111111; --sub:#6b6b6b; --line:#e7e5df; --soft:#f1efea;
  --good:#0f7b3f; --good-bg:#e7f5ec; --bad:#b42318; --bad-bg:#fcebe9; --warn:#8a6d00; --warn-bg:#fff6d6;
  --accent:#111111;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e0e0f; --card:#17171a; --ink:#f2f2f2; --sub:#9a9a9f; --line:#2a2a2f; --soft:#1f1f23;
    --good:#4ade80; --good-bg:#12301f; --bad:#f87171; --bad-bg:#3a1515; --warn:#facc15; --warn-bg:#3a3110; --accent:#f2f2f2;
  }
}
:root[data-theme="dark"]{
  --bg:#0e0e0f; --card:#17171a; --ink:#f2f2f2; --sub:#9a9a9f; --line:#2a2a2f; --soft:#1f1f23;
  --good:#4ade80; --good-bg:#12301f; --bad:#f87171; --bad-bg:#3a1515; --warn:#facc15; --warn-bg:#3a3110; --accent:#f2f2f2;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,"Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:1120px;margin:0 auto;padding:40px 16px 64px}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:28px}
.eyebrow{font-size:12px;letter-spacing:.22em;color:var(--sub);font-weight:600}
h1{font-size:clamp(30px,5vw,46px);line-height:1.05;margin:8px 0 6px;font-weight:800;letter-spacing:-.02em}
.meta{color:var(--sub);font-size:14px}
.btns{display:flex;gap:8px}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:9px 14px;border-radius:999px;font-size:13px;font-weight:600;transition:.15s}
button:hover{border-color:var(--ink)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:22px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.stat b{display:block;font-size:26px;font-weight:800;letter-spacing:-.02em}
.stat span{font-size:12px;color:var(--sub)}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:18px}
.chip{border:1px solid var(--line);background:transparent;padding:7px 14px;border-radius:999px;font-size:13px;font-weight:600;color:var(--sub)}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
input[type=search]{font:inherit;flex:1;min-width:140px;max-width:240px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 14px;border-radius:999px;font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px 18px 16px;display:flex;flex-direction:column;gap:12px;animation:in .35s ease both}
.card.fresh{box-shadow:0 0 0 2px var(--ink)}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.sym{font-size:22px;font-weight:800;letter-spacing:-.01em}
.tags{font-size:12px;color:var(--sub);margin-top:3px}
.time{font-size:12px;color:var(--sub);font-variant-numeric:tabular-nums}
.nums{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;background:var(--soft);border-radius:14px;padding:10px 12px}
.nums div span{display:block;font-size:11px;color:var(--sub)}
.nums div b{font-size:14px;font-weight:700;font-variant-numeric:tabular-nums}
.lots{display:flex;gap:6px}
.lot{flex:1;border:1px solid var(--line);border-radius:12px;padding:7px 8px;text-align:center}
.lot span{display:block;font-size:11px;color:var(--sub)}
.lot b{font-size:15px;font-variant-numeric:tabular-nums}
.why{font-size:12.5px;color:var(--sub);line-height:1.6}
.why em{font-style:normal;color:var(--good)} .why i{font-style:normal;color:var(--bad)}
.ev{font-size:12px;color:var(--warn);background:var(--warn-bg);border-radius:10px;padding:6px 10px}
.verdict{margin-top:auto;display:flex;justify-content:space-between;align-items:center;border-radius:14px;padding:11px 14px;font-weight:800;font-size:15px}
.verdict.good{background:var(--good-bg);color:var(--good)} .verdict.bad{background:var(--bad-bg);color:var(--bad)}
.verdict small{font-weight:600;font-size:12px;opacity:.85}
.empty{color:var(--sub);text-align:center;padding:60px 0}
footer{margin-top:40px;color:var(--sub);font-size:12px;line-height:1.7;border-top:1px solid var(--line);padding-top:18px}
@media (max-width:640px){.stats{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.wrap{padding-top:28px}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <div class="eyebrow">H4 ENGULF WATCH</div>
      <h1>H4 吞噬訊號</h1>
      <div class="meta" id="meta">載入中…</div>
    </div>
    <div class="btns">
      <button id="notif">🔔 開啟通知</button>
      <button id="theme">◐</button>
    </div>
  </header>

  <section class="stats">
    <div class="stat"><b id="sTotal">–</b><span>近 7 天訊號</span></div>
    <div class="stat"><b id="sGood" style="color:var(--good)">–</b><span>🟢 有利</span></div>
    <div class="stat"><b id="sBad" style="color:var(--bad)">–</b><span>🔴 不利</span></div>
    <div class="stat"><b id="sSym">–</b><span>監控商品</span></div>
  </section>

  <div class="bar">
    <button class="chip on" data-f="all">全部</button>
    <button class="chip" data-f="有利">🟢 有利</button>
    <button class="chip" data-f="不利">🔴 不利</button>
    <button class="chip" data-f="順勢">只看順勢</button>
    <input type="search" id="q" placeholder="搜尋商品，例如 EURUSD">
  </div>

  <main class="grid" id="grid"></main>

  <footer>
    紅吞噬＝做多、綠吞噬＝做空（全包：實體與高低點都包住前一根）。進場＝收盤價，停損＝吞噬高／低點，停利為 3R／6R 預估。<br>
    手數＝願意賠的金額 ÷（停損距離 × 每手價值＋$7 手續費），0.01 手捨去。新聞判斷：美國與德日英澳殖利率利差、美元、VIX、高收益債利差、原油，只用訊號當下已公布的資料。<br>
    回測：順勢策略「不利」組明顯較差，可當避開參考；逆勢策略不適用。依回測數字，不保證未來；不是投資建議。
  </footer>
</div>

<script>
const $ = s => document.querySelector(s);
let ALL = [], STATUS = {}, F = 'all';
const LS = {get(k){try{return localStorage.getItem(k)}catch(e){return null}}, set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};

(function theme(){
  const t = LS.get('theme'); if (t) document.documentElement.dataset.theme = t;
  $('#theme').onclick = () => {
    const cur = document.documentElement.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    const nx = cur === 'dark' ? 'light' : 'dark'; document.documentElement.dataset.theme = nx; LS.set('theme', nx);
  };
})();

$('#notif').onclick = async () => {
  if (!('Notification' in window)) return alert('這個瀏覽器不支援通知');
  const p = await Notification.requestPermission();
  $('#notif').textContent = p === 'granted' ? '🔔 通知已開' : '🔕 通知被擋';
};
if ('Notification' in window && Notification.permission === 'granted') $('#notif').textContent = '🔔 通知已開';

document.querySelectorAll('.chip').forEach(c => c.onclick = () => {
  document.querySelectorAll('.chip').forEach(x => x.classList.remove('on')); c.classList.add('on'); F = c.dataset.f; render();
});
$('#q').oninput = render;

const fmt = (x, d) => Number(x).toFixed(d);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function card(s, fresh){
  const good = s.verdict === '有利', d = s.digits;
  const lots = Object.entries(s.lots).map(([k, v]) =>
    `<div class="lot"><span>$${k}</span><b>${v.lot >= 0.01 ? v.lot.toFixed(2) : '—'}</b></div>`).join('');
  const why = [s.support.length ? `<em>支持</em>　${esc(s.support.join('、'))}` : '', s.against.length ? `<i>反對</i>　${esc(s.against.join('、'))}` : ''].filter(Boolean).join('<br>');
  return `<article class="card${fresh ? ' fresh' : ''}">
    <div class="top">
      <div><div class="sym">${esc(s.sym)}</div><div class="tags">${s.pattern}・做${s.side}・${s.trend}</div></div>
      <div class="time">${s.time.slice(5)} MT4</div>
    </div>
    <div class="nums">
      <div><span>進場</span><b>${fmt(s.entry, d)}</b></div>
      <div><span>停損 ${s.sl_pips}${(s.sl_unit||'pip')==='pip'?'p':'點'}</span><b>${fmt(s.sl, d)}</b></div>
      <div><span>停利 3R</span><b>${fmt(s.tp3, d)}</b></div>
      <div><span>停利 6R</span><b>${fmt(s.tp6, d)}</b></div>
    </div>
    <div class="lots">${lots}</div>
    ${s.cost_note ? `<div class="why">手數${esc(s.cost_note)}</div>` : ''}
    <div class="why">${why || '各因素中性'}</div>
    ${s.events && s.events.length ? `<div class="ev">⚠ ${esc(s.events.join('；'))}</div>` : ''}
    <div class="verdict ${good ? 'good' : 'bad'}"><span>${good ? '🟢 有利' : '🔴 不利'}</span><small>強度 ${s.strength}・${s.ratio > 0 ? '+' : ''}${s.ratio.toFixed(2)}</small></div>
  </article>`;
}

function render(){
  const q = $('#q').value.trim().toUpperCase();
  const rows = ALL.filter(s => (F === 'all' || s.verdict === F || (F === '順勢' && s.trend === '順勢')) && (!q || s.sym.includes(q)));
  const latest = ALL.length ? ALL[0].time : '';
  $('#grid').innerHTML = rows.length ? rows.slice(0, 120).map(s => card(s, s.time === latest)).join('') : '<div class="empty">目前沒有符合的訊號</div>';
}

async function load(manual){
  try{
    const [sig, st] = await Promise.all([fetch('signals.json?' + Date.now()).then(r => r.json()), fetch('status.json?' + Date.now()).then(r => r.json())]);
    ALL = sig; STATUS = st;
    const wk = Date.now() - 7 * 864e5, recent = ALL.filter(s => new Date(s.time.replace(' ', 'T') + 'Z') > wk);
    $('#sTotal').textContent = recent.length;
    $('#sGood').textContent = recent.filter(s => s.verdict === '有利').length;
    $('#sBad').textContent = recent.filter(s => s.verdict === '不利').length;
    $('#sSym').textContent = st.symbols;
    $('#meta').textContent = `最後更新 ${st.updated}（台灣）・每 4 小時掃描 Exness MT4 24 個商品` + (st.mt4 < st.symbols ? `・${st.symbols - st.mt4} 個用歷史檔` : '');
    render();
    const top = ALL[0];
    if (top && LS.get('seen') !== top.id){
      if (LS.get('seen') && 'Notification' in window && Notification.permission === 'granted'){
        const n = ALL.filter(s => s.time === top.time);
        new Notification(`H4 吞噬｜${n.length} 筆新訊號`, {body: n.map(s => `${s.sym} 做${s.side} ${s.verdict}`).join('\n'), tag: 'fx-engulf'});
      }
      LS.set('seen', top.id);
    }
  }catch(e){ $('#meta').textContent = '資料載入失敗，稍後自動重試'; }
}
load(); setInterval(load, 5 * 60 * 1000);
</script>
</body>
</html>
